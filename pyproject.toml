[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-automation"
version = "0.1.0"
description = "2D 익형/플랩 형상 최적화용 ANSYS Fluent 배치 해석 자동화"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib", "gmsh>=4.11"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
aero-auto = "aero_automation.cli:main"

[tool.setuptools]
packages = ["aero_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
