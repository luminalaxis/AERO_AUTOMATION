# AERO_AUTOMATION 프로젝트 설정 예시: 2D 익형 마하수 × 받음각 스윕

[project]
name = "airfoil_sweep"
template = "journal.jou"   # 케이스마다 치환될 Fluent 저널 템플릿
output_dir = "runs"        # 케이스 폴더가 생성될 위치
max_parallel = 1           # 동시에 돌릴 케이스 수 (라이선스/코어 수 고려)

[solver]
kind = "fluent"
# 비워두면 AWP_ROOTxxx 환경변수로 최신 버전 자동 탐색
# executable = 'C:\Program Files\ANSYS Inc\v242\fluent\ntbin\win64\fluent.exe'
mode = "2ddp"              # 2d / 2ddp / 3d / 3ddp
processes = 8              # 케이스당 코어 수 (-t8)
timeout_minutes = 120      # 초과 시 강제 종료 후 failed 처리
# extra_args = ["-mpi=intel"]

[constants]                # 모든 케이스 공통 값 (CSV/스윕 값이 우선)
iterations = 1000

[cases]
csv = "cases.csv"          # 행 단위 케이스 정의 (엑셀로 편집 가능)
name = "M{mach}_AoA{aoa}"  # 케이스 폴더 이름
group = "M{mach}"          # 분류 폴더: runs/M0.3/M0.3_AoA4

[cases.sweep]              # CSV 각 행 × 아래 값들의 전체 조합
aoa = [-4, 0, 4, 8, 12]

[derived]                  # 다른 변수로 계산되는 값 (저널에서 바로 사용 가능)
flow_x = "cos(radians(aoa))"
flow_y = "sin(radians(aoa))"

[results]
report_files = ["*.out"]   # 케이스 폴더에서 읽을 Fluent report-file
average_last = 50          # 마지막 50 iteration 평균을 결과값으로
